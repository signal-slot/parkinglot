name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each implementation has its own job. Adding a new resolution to an existing
# implementation = one line in the matrix. Adding a new implementation =
# copy a job and adjust the setup steps.

jobs:
  qt:
    name: qt × ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [800x600, 1024x600, 1280x800, 1920x1080]
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 + QML modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtqml-workerscript \
            qml6-module-qt5compat-graphicaleffects
      - name: Smoke run (offscreen)
        # Distros disagree on where the Qt 6 qml binary lives (Gentoo has qml6
        # in PATH, Ubuntu noble has qml at /usr/lib/x86_64-linux-gnu/qt6/bin/qml).
        # Ask qmake6 for the canonical bin dir.
        # 5s timeout: starting cleanly = pass; exit 124 = killed by timeout = OK.
        run: |
          QT_BIN=$(qmake6 -query QT_INSTALL_BINS)
          timeout 5 "$QT_BIN/qml" -platform offscreen qt/main.qml -- \
            --design "$PWD/design/qt/${{ matrix.resolution }}" \
            || [ $? -eq 124 ]

  qt-nogpu:
    name: qt-nogpu × ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [800x600, 1024x600, 1280x800, 1920x1080]
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 + QML modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtqml-workerscript
      - name: Smoke run (offscreen)
        run: |
          QT_BIN=$(qmake6 -query QT_INSTALL_BINS)
          timeout 5 "$QT_BIN/qml" -platform offscreen qt-nogpu/main.qml -- \
            --design "$PWD/design/qt-nogpu/${{ matrix.resolution }}" \
            || [ $? -eq 124 ]

  slint:
    name: slint × ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [320x240, 800x600, 1024x600, 1280x800, 1920x1080]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install slint native deps
        # yeslogic-fontconfig-sys (transitively via slint-build > i-slint-renderer-software
        # > resvg > fontdb) needs fontconfig + freetype headers to build.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev \
            libfreetype6-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ci/slint-check
      - name: Compile-check slint/main.slint × design/slint/${{ matrix.resolution }}
        run: cargo check
        working-directory: .ci/slint-check
        env:
          SLINT_RES: ${{ matrix.resolution }}

  pico:
    name: pico × ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [320x240]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pico
      - run: cargo check --features pico --target thumbv6m-none-eabi
        working-directory: pico
        env:
          PICO_RES: ${{ matrix.resolution }}

  pico2:
    name: pico2 × ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [320x240]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv8m.main-none-eabihf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pico2
      - run: cargo check --target thumbv8m.main-none-eabihf
        working-directory: pico2
        env:
          PICO_RES: ${{ matrix.resolution }}

  flutter:
    name: flutter (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: flutter
      - run: flutter build ${{ matrix.target }}
        working-directory: flutter
